version: '3.9'

services:
  db:
    image: mysql:8
    container_name: ecommerce_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ecomdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  redis:
    image: redis:7
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6380:6379"

  web:
    build: .
    container_name: ecommerce_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis